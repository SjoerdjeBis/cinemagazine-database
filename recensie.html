<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)">
  <title>Recensie — Cinemagazine Filmwaarderingen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:   #F4F1EA;
      --surface: #FFFDF8;
      --ink:     #1B1915;
      --muted:   #5E584D;
      --faint:   #9A9385;
      --border:  #CFC8B8;
      --accent:  #A51D2A;
      --jw:      #1B3A6B;
      --b-top:   #1D6B39;
      --b-high:  #37803F;
      --b-mid:   #A4561A;
      --b-low:   #A8322A;
      --b-none-bg: #DDD6C6;
      --b-none-fg: #5E584D;
      --serif: Fraunces, Georgia, serif;
      --sans:  'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper:   #15130F;
        --surface: #1E1B16;
        --ink:     #EDE8DD;
        --muted:   #A9A294;
        --faint:   #6F695E;
        --border:  #3B362D;
        --accent:  #E35D68;
        --jw:      #8FB0E8;
        --b-none-bg: #2F2B24;
        --b-none-fg: #A9A294;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    a, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---- Balk ---- */
    .bar {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px 24px;
      padding: 10px 24px 12px;
      border-bottom: 3px solid var(--ink);
      box-shadow: 0 3px 0 -2px var(--paper), 0 4px 0 -2px var(--ink);   /* dubbele lijn, zoals de lijst */
      position: relative;
      z-index: 1;
    }
    .home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }
    .home:hover { text-decoration: underline; text-underline-offset: 3px; }

    .film { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .badge {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }
    .b-top  { background: var(--b-top); }
    .b-high { background: var(--b-high); }
    .b-mid  { background: var(--b-mid); }
    .b-low  { background: var(--b-low); }
    .b-none { background: var(--b-none-bg); color: var(--b-none-fg); font-weight: 500; }
    .t {
      font-family: var(--serif);
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta { margin-top: 2px; font-size: 0.82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .actions { display: flex; align-items: center; gap: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 160ms var(--ease-out), border-color 150ms ease, background-color 150ms ease, color 150ms ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn.trakt { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .btn.jw { border-color: var(--jw); color: var(--jw); }
    .btn.muted { border-style: dashed; color: var(--faint); cursor: default; }
    @media (hover: hover) and (pointer: fine) {
      .btn:hover { border-color: var(--ink); }
      .btn.trakt:hover { opacity: 0.88; }
      .btn.jw:hover { background: var(--jw); color: var(--surface); }
      .btn.muted:hover { border-color: var(--border); }
    }

    /* ---- Recensie ---- */
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
    .msg { margin: auto; padding: 24px; text-align: center; color: var(--muted); line-height: 1.6; }
    .msg a { color: var(--accent); }

    @media (max-width: 760px) {
      .bar {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "film home" "actions actions";
        padding: 8px 12px 10px;
        gap: 8px 12px;
      }
      .home { grid-area: home; }
      .home span { display: none; }
      .film { grid-area: film; }
      .t { font-size: 1.1rem; }
      .actions { grid-area: actions; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .btn { padding: 0 8px; font-size: 0.8rem; }
    }
    @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
  </style>
</head>
<body>

<header class="bar">
  <a class="home" href="./" aria-label="Terug naar Filmwaarderingen">←<span>Filmwaarderingen</span></a>
  <div class="film" id="film"><div class="t">Laden…</div></div>
  <nav class="actions" id="actions" aria-label="Deze film elders"></nav>
</header>

<div class="msg" id="msg" hidden></div>

<script src="links.js"></script>
<script>
'use strict';

// De Cinemagazine-recensie van ?id=… in een kader, met een balk erboven naar Trakt
// en JustWatch. Cinemagazine blokkeert inladen in een kader nu niet; doen ze dat
// ooit wel, dan blijft de knop 'Cinemagazine ↗' de recensie gewoon openen.
(async () => {
  const id  = Number(new URLSearchParams(location.search).get('id'));
  const msg = document.getElementById('msg');
  try {
    const res = await fetch('data/reviews.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const r = (await res.json()).reviews.find(x => x.id === id);
    if (!r) {
      document.getElementById('film').innerHTML = '<div class="t">Recensie niet gevonden</div>';
      msg.innerHTML = 'Deze recensie staat niet (meer) in de lijst.<br><a href="./">Terug naar Filmwaarderingen</a>';
      msg.hidden = false;
      return;
    }

    const title = cleanTitle(r.title);
    document.title = `${title} — recensie`;
    const meta = [r.filmYear, (r.genres || []).slice(0, 3).join(', '),
                  typeof r.imdb === 'number' ? `IMDb ${dec(r.imdb.toFixed(1))}` : ''].filter(Boolean).join(' · ');
    document.getElementById('film').innerHTML = `
      <span class="badge ${badgeClass(r.rating)}" aria-label="Cinemagazine-cijfer ${r.rating === null ? 'onbekend' : dec(r.rating)}">${r.rating === null ? '–' : dec(r.rating)}</span>
      <div style="min-width:0"><div class="t">${esc(title)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ''}</div>`;

    const jw = jwUrl(r);
    document.getElementById('actions').innerHTML = `
      <a class="btn trakt" href="${esc(traktUrl(r))}" target="_blank" rel="noopener"
         title="${r.traktSlug ? 'Op je Trakt-watchlist zetten' : 'Zoeken op Trakt'}">+ Trakt</a>
      ${jw
        ? `<a class="btn jw" href="${esc(jw)}" target="_blank" rel="noopener">
             <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>JustWatch</a>`
        : '<span class="btn muted" title="JustWatch kent deze film, maar hij is in Nederland nergens te zien">Niet in NL</span>'}
      <a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener" title="Open de recensie op cinemagazine.nl">Cinemagazine ↗</a>`;

    const frame = document.createElement('iframe');
    frame.src = r.url;
    frame.title = `Recensie van ${title} op Cinemagazine`;
    frame.referrerPolicy = 'no-referrer-when-downgrade';
    document.body.append(frame);
  } catch (err) {
    msg.innerHTML = `Kon de gegevens niet laden: ${esc(err.message)}<br><a href="./">Terug naar Filmwaarderingen</a>`;
    msg.hidden = false;
  }
})();
</script>
</body>
</html>
